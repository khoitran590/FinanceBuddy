services:
  - type: web
    name: financebuddy
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: FINANCEBUDDY_ENV
        value: production
      - key: PLAID_ENV
        value: production
      - key: PLAID_COUNTRY_CODES
        value: US
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_TOKEN_ENCRYPTION_KEY
        generateValue: true
