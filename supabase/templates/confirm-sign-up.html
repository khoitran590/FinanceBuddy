<h2>Confirm your FinanceBuddy account</h2>

<p>Confirm your email address to open FinanceBuddy.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email">Confirm and open FinanceBuddy</a></p>

<p>Or enter this verification code on the Create account page: <strong>{{ .Token }}</strong></p>
<p>If you did not create a FinanceBuddy account, you can ignore this email.</p>
